server.port=8080
server.error.include-message=always

spring.application.name=cricket-scoring-platform

spring.datasource.url=${DB_URL:jdbc:h2:mem:cricketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

ai.api.key=${AI_API_KEY:demo-key}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.model=${AI_MODEL:gpt-3.5-turbo}
